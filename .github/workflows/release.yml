name: Build Emberwild and complete art releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing world version tag to build
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: world
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tools/check-source.mjs
        working-directory: world
      - id: engine
        run: node tools/engine-config.mjs >> "$GITHUB_OUTPUT"
        working-directory: world
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ steps.engine.outputs.ref }}
          path: engine
          persist-credentials: false
      - run: npm ci
        working-directory: engine
      - run: npx playwright install --with-deps firefox ffmpeg
        working-directory: engine
      - run: xvfb-run -a node tools/build-world-assets.js --world ../world
        working-directory: engine
        env:
          HEADED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: node -e 'if(process.env.RELEASE_TAG!=="v"+require("./world.json").version)process.exit(1)'
        working-directory: world
      - run: node tools/check-world.js --world ../world
        working-directory: engine
      - run: node tools/test-world.js --world ../world
        working-directory: engine
      - run: node tools/package-release.js --world ../world --assets
        working-directory: engine
      - run: sha256sum -c SHA256SUMS
        working-directory: engine/dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: engine/dist/*
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Emberwild $RELEASE_TAG" --notes-file release-files/RELEASE_NOTES.md release-files/*
