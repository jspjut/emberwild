name: Build Emberwild website
'on':
  push:
    branches:
    - main
    - master
    paths: &id001
    - site/**
    - client/**
    - shared/**
    - server/**
    - docs/**
    - README.md
    - LICENSE
    - PROVENANCE.md
    - THIRD_PARTY.md
    - SECURITY.md
    - CONTRIBUTING.md
    - .github/workflows/pages.yml
    - world.json
    - .github/engine.json
    - tools/build-assets.js
    - tools/preview-assets.js
  pull_request:
    paths: *id001
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: world
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - id: engine
      run: node tools/engine-config.mjs >> "$GITHUB_OUTPUT"
      working-directory: world
    - uses: actions/checkout@v6
      with:
        repository: ${{ steps.engine.outputs.repository }}
        ref: ${{ steps.engine.outputs.ref }}
        path: engine
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: engine/package-lock.json
    - run: npm ci
      working-directory: engine
    - run: node tools/check-source.mjs
      working-directory: world
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('engine/package-lock.json') }}
    - run: npx playwright install --with-deps firefox ffmpeg
      working-directory: engine
    - id: art-key
      run: echo "key=emberwild-art-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('world/client/**', 'world/shared/**', 'world/server/**', 'world/world.json', 'world/.github/engine.json', 'world/tools/build-assets.js', 'world/tools/preview-assets.js') }}" >> "$GITHUB_OUTPUT"
    - id: art
      uses: actions/cache@v4
      with:
        path: 'world/client/assets/models

          world/client/assets/previews

          world/client/assets/icons

          world/client/assets/library-manifest.json

          world/client/assets/catalog.html

          world/client/assets/ITEMIZATION_AND_LEVELING.md'
        key: ${{ steps.art-key.outputs.key }}
    - run: xvfb-run -a node tools/build-world-assets.js --world ../world
      working-directory: engine
      env:
        HEADED: '1'
        LIBGL_ALWAYS_SOFTWARE: '1'
      timeout-minutes: 20
      if: steps.art.outputs.cache-hit != 'true'
    - run: node tools/test-world.js --world ../world --script tests/asset-library.test.js --timeout 300
      working-directory: engine
      if: steps.art.outputs.cache-hit == 'true'
      timeout-minutes: 6
    - run: git diff --exit-code -- shared/prop-profiles.js
      working-directory: world
    - run: node tools/site-media.js --project world --world ../world >> "$GITHUB_OUTPUT"
      working-directory: engine
      id: media
    - uses: actions/cache@v4
      with:
        path: engine/.site-media
        key: ${{ runner.os }}-${{ runner.arch }}-site-media-v1-${{ steps.media.outputs.key }}
    - run: xvfb-run -a node tools/build-site.js --media-cache .site-media --project world --world ../world --output ../world/.site
      working-directory: engine
      env:
        HEADED: '1'
        LIBGL_ALWAYS_SOFTWARE: '1'
      timeout-minutes: 6
    - uses: actions/upload-pages-artifact@v4
      with:
        path: world/.site
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (vars.ENABLE_PAGES == 'true' || inputs.deploy == true)
    steps:
    - uses: actions/configure-pages@v5
    - id: deployment
      uses: actions/deploy-pages@v4
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
